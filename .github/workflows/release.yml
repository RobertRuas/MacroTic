name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build release binary
        run: swift build -c release

      - name: Import code signing certificate
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/codesign.p12"
          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CODESIGN_P12_PASSWORD" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          openssl pkcs12 -in "$CERT_PATH" -passin "pass:$CODESIGN_P12_PASSWORD" -clcerts -nokeys -out "$RUNNER_TEMP/codesign.pem"
          security add-trusted-cert -r trustRoot -p codeSign -k "$KEYCHAIN_PATH" "$RUNNER_TEMP/codesign.pem"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH" "$RUNNER_TEMP/codesign.pem"

      - name: Package MacroTic.app
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_OWNER: ${{ github.repository_owner }}
          APP_REPO: ${{ github.event.repository.name }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: bash Scripts/package_app.sh

      - name: Sign update and build appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: bash Scripts/build_appcast.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/*.zip dist/appcast.xml \
            --title "MacroTic ${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Keep only the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            if [ "$tag" != "$CURRENT_TAG" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes
            fi
          done

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/codesign.keychain-db" || true
